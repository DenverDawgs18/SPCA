{% load static %}
<nav class="sidebar-nav">
  <div class="sidebar-header">
    <span class="sidebar-title">Manager Portal</span>
    <span class="sidebar-user">{{ request.user.get_full_name|default:request.user.username }}</span>
  </div>
  <a href="{% url 'volunteers:mgr_dashboard' %}" class="{% if request.resolver_match.url_name == 'mgr_dashboard' %}active{% endif %}">
    <span class="sidebar-icon">&#9632;</span> Dashboard
  </a>
  <a href="{% url 'volunteers:mgr_applications' %}" class="{% if 'applications' in request.resolver_match.url_name %}active{% endif %}">
    <span class="sidebar-icon">&#128196;</span> Applications
    {% if pending_count %}
    <span class="sidebar-badge">{{ pending_count }}</span>
    {% endif %}
  </a>
  <a href="{% url 'volunteers:mgr_volunteers' %}" class="{% if 'volunteer' in request.resolver_match.url_name and 'application' not in request.resolver_match.url_name %}active{% endif %}">
    <span class="sidebar-icon">&#128100;</span> Volunteers
  </a>
  <a href="{% url 'volunteers:mgr_shifts' %}" class="{% if 'shift' in request.resolver_match.url_name %}active{% endif %}">
    <span class="sidebar-icon">&#128197;</span> Shifts
  </a>
  <a href="{% url 'volunteers:mgr_hour_logs' %}" class="{% if request.resolver_match.url_name == 'mgr_hour_logs' %}active{% endif %}">
    <span class="sidebar-icon">&#128202;</span> Hour Logs
  </a>
  <a href="{% url 'volunteers:mgr_group_email' %}" class="{% if request.resolver_match.url_name == 'mgr_group_email' %}active{% endif %}">
    <span class="sidebar-icon">&#9993;</span> Send Email
  </a>
  <a href="{% url 'volunteers:mgr_settings' %}" class="{% if request.resolver_match.url_name == 'mgr_settings' %}active{% endif %}">
    <span class="sidebar-icon">&#9881;</span> Settings
  </a>
  <div class="sidebar-divider"></div>
  <a href="{% url 'volunteers:log_hours' %}" style="opacity:0.7;font-size:0.82rem;">Kiosk: Log Hours</a>
  <div class="sidebar-divider"></div>
  <form method="post" action="{% url 'volunteers:logout' %}" style="margin:0;">
    {% csrf_token %}
    <button type="submit" class="sidebar-logout-btn">Sign Out</button>
  </form>
</nav>
