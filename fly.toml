# Fly.io app configuration for Medina County SPCA
# Generated for fly.io deploy — edit app name before deploying.
app = "medina-county-spca"          # CHANGE THIS to your chosen app name
primary_region = "ord"              # Chicago — closest to Seville, OH

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  DJANGO_SETTINGS_MODULE = "spca_project.settings"
  # ALLOWED_HOSTS is set automatically via the [env] block below after deploy:
  # ALLOWED_HOSTS = "medina-county-spca.fly.dev"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 35

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health/"

[[mounts]]
  source = "spca_media"
  destination = "/app/media"
