# fly.toml app configuration file generated for medina-county-spca on 2026-05-25T16:50:44-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'medina-county-spca'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEBUG = 'False'
  DJANGO_SETTINGS_MODULE = 'spca_project.settings'

[[mounts]]
  source = 'spca_media'
  destination = '/app/media'

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 35

  [[services.http_checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
