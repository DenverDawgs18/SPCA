# fly.toml — Medina County SPCA
# See https://fly.io/docs/reference/configuration/

app = 'medina-county-spca'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEBUG = 'False'
  DJANGO_SETTINGS_MODULE = 'spca_project.settings'

[[mounts]]
  source = 'spca_media'
  destination = '/app/media'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/health/"
    timeout = "10s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
